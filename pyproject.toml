[tool.poetry]
name = "logitrack-data-platform"
version = "0.1.0"
description = "Pipeline de datos end-to-end para el escenario LogiTrack"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=2.0,<3"
pandas = ">=2.2,<3"
pyarrow = ">=17,<25"
pyyaml = ">=6.0,<7"
python-dotenv = ">=1.0,<2"
sqlalchemy = ">=2.0,<3"
psycopg = { version = ">=3.2,<4", extras = ["binary"] }
azure-identity = ">=1.17,<2"
azure-keyvault-secrets = ">=4.8,<5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pre-commit = "^4.6.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
